<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - PetMinder</title>

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="Home.css" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&family=Inter:wght@800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app-container">
      <div class="scrollable-content">
        <main class="homepage">

          <!-- Header -->
          <header>
            <h1 class="page-title">My Pets</h1>
          </header>

          <!-- Main Content -->
          <section class="content-container">

            <!-- Pets Gallery -->
            <div class="pets-gallery-container">
              <div class="pets-gallery" id="petsGallery">

                <!-- Pet Card 1 -->
                <article class="pet-card active" data-index="0">
                  <img
                    src="https://cdn.builder.io/api/v1/image/assets/TEMP/c9e1ac1630aed306d3fea3fb7503c62136116e8e?placeholderIfAbsent=true&apiKey=82d483615798456e8eba6eee5f39bef1"
                    alt="Pet 1 thumbnail"
                    class="pet-thumbnail"
                  />
                  <h2 class="pet-name">Pet 1</h2>
                </article>

                <!-- Pet Card 2 -->
                <article class="pet-card" data-index="1">
                  <img
                    src="https://cdn.builder.io/api/v1/image/assets/TEMP/0ed1370b656c2aa0ebb8b58b050a7008612b035e?placeholderIfAbsent=true&apiKey=82d483615798456e8eba6eee5f39bef1"
                    alt="Pet 2 thumbnail"
                    class="pet-thumbnail"
                  />
                  <h2 class="pet-name">Pet 2</h2>
                </article>

                <!-- Pet Card 3 -->
                <article class="pet-card" data-index="2">
                  <img
                    src="https://cdn.builder.io/api/v1/image/assets/TEMP/3ca582665a41cfad00df7f49696301391e560288?placeholderIfAbsent=true&apiKey=82d483615798456e8eba6eee5f39bef1"
                    alt="Pet 3 thumbnail"
                    class="pet-thumbnail"
                  />
                  <h2 class="pet-name">Pet 3</h2>
                </article>
              </div>

              <!-- Navigation Dots -->
              <div class="gallery-navigation">
                <span class="gallery-dot active" data-index="0" aria-label="Select Pet 1"></span>
                <span class="gallery-dot" data-index="1" aria-label="Select Pet 2"></span>
                <span class="gallery-dot" data-index="2" aria-label="Select Pet 3"></span>
              </div>

              <!-- See All Link -->
              <a href="AllPets.html" class="see-all-link">See all</a>
            </div>

            <!-- Ongoing Sessions -->
            <h2 class="section-title">Ongoing Sessions</h2>

            <h3 class="session-pet-name">Pet 1</h3>
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/1717c512005ecdff3deffb04502a8a621da764b6?placeholderIfAbsent=true&apiKey=82d483615798456e8eba6eee5f39bef1"
              alt="Pet 1 session details"
              class="session-image"
            />

            <h3 class="session-pet-name">Pet 2</h3>
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/1717c512005ecdff3deffb04502a8a621da764b6?placeholderIfAbsent=true&apiKey=82d483615798456e8eba6eee5f39bef1"
              alt="Pet 2 session details"
              class="session-image"
            />
          </section>

          <!-- Spacer for bottom navigation -->
          <div class="nav-spacer"></div>
        </main>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-navigation">
        <div class="nav-background"></div>
        <div class="nav-icons">

          <!-- Home -->
          <a href="Home.html" aria-label="Home">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/700457b31836db1d0b395fea39fb88c8c67be541?placeholderIfAbsent=true&apiKey=82d483615798456e8eba6eee5f39bef1"
              alt=""
              class="nav-icon"
            />
          </a>

          <!-- Messages -->
          <a href="Messages.html" aria-label="Messages">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/90c0fa9386108cc4b6b2d22a3755f8429b1df731?placeholderIfAbsent=true&apiKey=82d483615798456e8eba6eee5f39bef1"
              alt=""
              class="nav-icon"
            />
          </a>

          <!-- Search -->
          <a href="SearchMinder.html" class="search-button" aria-label="Search">🔍</a>

          <!-- Settings -->
          <a href="Settings.html" aria-label="Settings">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/2b7ab3e93b6956692a7a790f3b78eaeb88398c90?placeholderIfAbsent=true&apiKey=82d483615798456e8eba6eee5f39bef1"
              alt=""
              class="nav-icon-large"
            />
          </a>

          <!-- User Profile -->
          <a href="Profile.html" aria-label="User Profile">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/a5b95812132a4e335c2892d2eed0e35d70aa6271?placeholderIfAbsent=true&apiKey=82d483615798456e8eba6eee5f39bef1"
              alt=""
              class="nav-icon"
            />
          </a>
        </div>
      </nav>
    </div>

    <!-- JavaScript Section -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("fade-in");

        const petCards = document.querySelectorAll(".pet-card");
        const dots = document.querySelectorAll(".gallery-dot");

        function selectPetCard(index) {
          petCards.forEach(card => card.classList.remove("active"));
          dots.forEach(dot => dot.classList.remove("active"));
          petCards[index].classList.add("active");
          dots[index].classList.add("active");
        }

        petCards.forEach(card => {
          card.addEventListener("click", function () {
            const index = this.getAttribute("data-index");
            selectPetCard(parseInt(index));
            this.classList.add("pulse");
            setTimeout(() => this.classList.remove("pulse"), 300);
          });
        });

        dots.forEach(dot => {
          dot.addEventListener("click", e => {
            e.preventDefault();
            const index = dot.getAttribute("data-index");
            selectPetCard(parseInt(index));
          });
        });

        selectPetCard(0);

        // Ripple and page transition on link click
        document.querySelectorAll("a").forEach(link => {
          link.addEventListener("click", function (e) {
            if (this.hostname === window.location.hostname) {
              e.preventDefault();
              const href = this.getAttribute("href");

              if (!this.classList.contains("search-button")) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const ripple = document.createElement("span");
                ripple.classList.add("ripple");
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
              }

              document.body.classList.add("fade-out");
              setTimeout(() => (window.location.href = href), 300);
            }
          });
        });

        // Keyboard navigation for pet cards
        document.addEventListener("keydown", function (e) {
          if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
            const currentIndex = parseInt(
              document.querySelector(".pet-card.active").getAttribute("data-index")
            );
            let newIndex = e.key === "ArrowLeft"
              ? Math.max(0, currentIndex - 1)
              : Math.min(petCards.length - 1, currentIndex + 1);
            selectPetCard(newIndex);
          }
        });
      });
    </script>
  </body>
</html>
