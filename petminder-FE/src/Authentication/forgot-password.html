<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - PetMinder</title>
    <link rel="stylesheet" href="forgot-password.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="forgot-password-page">
      <h1 class="page-heading">Forgot Password</h1>

      <div class="lock-icon-container">
        <span class="lock-icon" aria-hidden="true">🔒</span>
      </div>

      <p class="instruction-text">Enter Email Address</p>

      <form
        class="password-reset-form"
        action="code-sent-page.html"
        method="post"
        onsubmit="handleFormSubmit(event)"
      >
        <div class="input-container">
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
              class="form-input"
            />
            <span class="input-icon" aria-hidden="true">✉️</span>
          </div>
        </div>

        <button type="submit" class="submit-button">Send Code</button>
      </form>

      <a href="login-page.html" class="back-link">Back to sign in</a>
    </main>

    <script>
      function handleFormSubmit(event) {
        event.preventDefault();

        const emailInput = document.getElementById("email");
        const submitButton = document.querySelector(".submit-button");
        const form = document.querySelector(".password-reset-form");

        if (emailInput.validity.valid) {
          // Show loading state
          submitButton.textContent = "Sending...";
          submitButton.disabled = true;

          // Add transition effect before redirect
          document.body.classList.add("fade-out");

          // Simulate API call and redirect
          setTimeout(() => {
            window.location.href = "code-sent-page.html";
          }, 1000);
        }
      }

      // Add fade-in class when page loads
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("fade-in");
      });
    </script>
  </body>
</html>
