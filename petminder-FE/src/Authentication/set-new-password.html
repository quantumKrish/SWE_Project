<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password - PetMinder</title>
    <link rel="stylesheet" href="set-new-password.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="password-reset-page">
      <h1 class="page-heading">Set New Password</h1>

      <div class="lock-icon-container">
        <span class="lock-icon" aria-hidden="true">🔒</span>
      </div>

      <form
        class="password-reset-form"
        action="password-success.html"
        method="post"
        onsubmit="handleFormSubmit(event)"
      >
        <div class="input-container">
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              required
              class="form-input"
            />
            <span class="input-icon" aria-hidden="true">🔑</span>
          </div>
        </div>

        <div class="input-container">
          <div class="input-wrapper">
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Re-enter Password"
              required
              class="form-input"
            />
            <span class="input-icon" aria-hidden="true">🔑</span>
          </div>
        </div>

        <div class="form-actions">
          <a href="login-page.html" class="back-link">Back to sign in</a>
          <button type="submit" class="submit-button">Set Password</button>
        </div>
      </form>
    </main>

    <script>
      function handleFormSubmit(event) {
        event.preventDefault();

        const passwordInput = document.getElementById("password");
        const confirmPasswordInput =
          document.getElementById("confirm-password");
        const submitButton = document.querySelector(".submit-button");

        // Basic validation
        if (passwordInput.value !== confirmPasswordInput.value) {
          alert("Passwords do not match!");
          return;
        }

        if (
          passwordInput.validity.valid &&
          confirmPasswordInput.validity.valid
        ) {
          // Show loading state
          submitButton.textContent = "Setting...";
          submitButton.disabled = true;

          // Add transition effect before redirect
          document.body.classList.add("fade-out");

          // Simulate API call and redirect
          setTimeout(() => {
            window.location.href = "success-password-reset.html";
          }, 1000);
        }
      }

      // Add fade-in class when page loads
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("fade-in");
      });
    </script>
  </body>
</html>
