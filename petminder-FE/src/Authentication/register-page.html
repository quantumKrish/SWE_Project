<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - PetMinder</title>
    <link rel="stylesheet" href="register-page.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="register-page">
      <img
        src="https://cdn.builder.io/api/v1/image/assets/82d483615798456e8eba6eee5f39bef1/ca48325ce9badd3c8a8a395ed4e995ededa6d048?placeholderIfAbsent=true"
        alt="Minder Logo"
        class="logo"
      />

      <h1 class="welcome-heading">Welcome to Minder!</h1>
      <p class="create-account-text">Create your account</p>

      <form class="registration-form" action="dashboard.html" method="post">
        <div class="input-container">
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              required
              class="form-input"
            />
            <span class="input-icon" aria-hidden="true">✉️</span>
          </div>
        </div>

        <div class="input-container">
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              required
              class="form-input"
            />
            <span class="input-icon" aria-hidden="true">🔒</span>
          </div>
        </div>

        <div class="input-container">
          <div class="input-wrapper">
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              placeholder="Re-enter Password"
              required
              class="form-input"
            />
            <span class="input-icon" aria-hidden="true">🔒</span>
          </div>
        </div>

        <button type="submit" class="register-button">Register</button>
      </form>

      <div class="login-section">
        <p class="login-text">Already have an account?</p>
        <a href="login-page.html" class="login-link">Login!</a>
      </div>
    </main>
  </body>
</html>
