<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset Success - PetMinder</title>
    <link rel="stylesheet" href="success-password-reset.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="password-reset-success">
      <section class="success-container">
        <span class="success-icon" aria-hidden="true">✅</span>
        <h1 class="success-heading">Successfully<br />Set New Password!</h1>
        <p class="success-message">
          You can now sign in with your new password
        </p>
        <a
          href="login-page.html"
          class="sign-in-button"
          role="button"
          onclick="handleButtonClick(event)"
        >Back to Sign In</a>
      </section>
    </main>

    <script>
      // Add fade-in class when page loads
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("fade-in");
      });

      function handleButtonClick(event) {
        event.preventDefault();

        // Add transition effect before redirect
        document.body.classList.remove("fade-in");
        document.body.classList.add("fade-out");

        // Redirect after animation completes
        setTimeout(() => {
          window.location.href = "login-page.html";
        }, 500);
      }
    </script>
  </body>
</html>
