<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - PetMinder</title>
  <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&family=Inter:wght@800&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Profile.css" />
</head>

<body class="fade-in">
  <div class="app-container">
    <div class="scrollable-content">
      <main class="profile-page">

        <!-- Profile Info -->
        <section class="profile-header">
          <img src="https://via.placeholder.com/100" alt="Profile picture" class="profile-picture" />
          <h2 class="username">@petlover123</h2>
          <p class="full-name">Alex Johnson</p>
          <p class="location">📍 New York, NY</p>
          <a href="EditProfile.html" class="edit-button" aria-label="Edit Profile">Edit Profile</a>

        </section>

        <!-- Reviews (Dynamic) -->
        <section class="reviews-section">
          <h3 class="section-title">Reviews</h3>
          <div id="reviewsContainer" aria-live="polite"></div>
        </section>

        <div class="nav-spacer"></div>
      </main>
    </div>

    <!-- Navigation -->
    <nav class="bottom-navigation">
      <div class="nav-background"></div>
      <div class="nav-icons">
        <a href="Home.html" aria-label="Home">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/700457b31836db1d0b395fea39fb88c8c67be541" class="nav-icon" alt="Home" />
        </a>
        <a href="Messages.html" aria-label="Messages">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/90c0fa9386108cc4b6b2d22a3755f8429b1df731" class="nav-icon" alt="Messages" />
        </a>
        <a href="SearchMinder.html" class="search-button" aria-label="Search">🔍</a>
        <a href="Settings.html" aria-label="Settings">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/2b7ab3e93b6956692a7a790f3b78eaeb88398c90" class="nav-icon-large" alt="Settings" />
        </a>
        <a href="Profile.html" aria-label="Profile">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/a5b95812132a4e335c2892d2eed0e35d70aa6271" class="nav-icon active-icon" alt="Profile" />
        </a>
      </div>
    </nav>
  </div>

  <!-- Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Animate body on load
      document.body.classList.add("fade-in");

      // Handle ripple + page transitions on internal link clicks
      document.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", handleLinkClick);
      });

      // Load reviews dynamically
      loadReviews();
    });

    function handleLinkClick(e) {
      if (this.hostname === window.location.hostname) {
        e.preventDefault();
        const href = this.getAttribute("href");

        const { left, top } = this.getBoundingClientRect();
        const x = e.clientX - left;
        const y = e.clientY - top;

        const ripple = document.createElement("span");
        ripple.classList.add("ripple");
        ripple.style.left = `${x}px`;
        ripple.style.top = `${y}px`;
        this.appendChild(ripple);

        setTimeout(() => ripple.remove(), 600);
        document.body.classList.add("fade-out");
        setTimeout(() => window.location.href = href, 300);
      }
    }

    function loadReviews() {
      const reviews = [
        {
          name: "Example User",
          rating: 5,
          text: "Example Review text goes here. This is a sample review to demonstrate the layout."
        },
        {
          name: "Example User2",
          rating: 4,
          text: "Another sample review to show dynamic rendering in action."
        },
        {
          name: "Example User3",
          rating: 5,
          text: "Excellent experience! Highly recommend this minder."
        }
      ];

      const container = document.getElementById("reviewsContainer");

      reviews.forEach(({ name, rating, text }) => {
        const reviewEl = document.createElement("article");
        reviewEl.className = "review-card";

        reviewEl.innerHTML = `
          <h4 class="reviewer-name">${name}</h4>
          <div class="rating">${"★".repeat(rating)}${"☆".repeat(5 - rating)}</div>
          <p class="review-text">${text}</p>
        `;

        container.appendChild(reviewEl);
      });
    }
  </script>
</body>
</html>
