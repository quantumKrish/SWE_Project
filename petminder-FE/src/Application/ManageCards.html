<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Cards - PetMinder</title>
  <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&family=Inter:wght@800&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ManageCards.css" />
</head>

<body class="fade-in">
  <div class="app-container">
    <div class="scrollable-content">
      <main class="manage-cards-page">
        <header>
          <h1 class="page-title">Manage Cards</h1>
        </header>

        <section class="card-list">
          <!-- Example static cards (replace dynamically) -->
          <article class="card-item">
            <div class="card-info">
              <p class="card-holder">Alex Johnson</p>
              <p class="card-number">**** **** **** 1234</p>
              <p class="card-expiry">Expires 07/26</p>
            </div>
            <button class="delete-button" aria-label="Delete Card">Remove</button>
          </article>

          <article class="card-item">
            <div class="card-info">
              <p class="card-holder">Alex Johnson</p>
              <p class="card-number">**** **** **** 9876</p>
              <p class="card-expiry">Expires 11/25</p>
            </div>
            <button class="delete-button" aria-label="Delete Card">Remove</button>
          </article>
        </section>

        <div class="button-group">
          <a href="AddCard.html" class="action-button">Add Another Card</a>
          <a href="Payment.html" class="action-button secondary">Go Back</a>
        </div>

        <div class="nav-spacer"></div>
      </main>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");

      document.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", function(e) {
          if (this.hostname === window.location.hostname) {
            e.preventDefault();
            const href = this.getAttribute("href");

            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const ripple = document.createElement("span");
            ripple.classList.add("ripple");
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            this.appendChild(ripple);

            setTimeout(() => ripple.remove(), 600);
            document.body.classList.add("fade-out");
            setTimeout(() => (window.location.href = href), 300);
          }
        });
      });

      document.querySelectorAll(".delete-button").forEach(button => {
        button.addEventListener("click", () => {
          const card = button.closest(".card-item");
          card.remove();
        });
      });
    });
  </script>
</body>
</html>
