<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Pet - PetMinder</title>
  <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&family=Inter:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="AddPet.css" />
</head>

<body class="fade-in">
  <div class="app-container">
    <div class="scrollable-content">
      <main class="add-pet-page">
        <h1 class="page-title">Add a New Pet</h1>

        <form class="add-pet-form" id="addPetForm">
          <label>
            Pet Name
            <input type="text" name="name" required />
          </label>

          <label>
            Type
            <select name="type" required>
              <option value="" disabled selected>Select type</option>
              <option>Dog</option>
              <option>Cat</option>
              <option>Bird</option>
              <option>Other</option>
            </select>
          </label>

          <label>
            Breed
            <input type="text" name="breed" required />
          </label>

          <label>
            Age
            <input type="number" name="age" min="0" max="50" required />
          </label>

          <label>
            Notes (optional)
            <textarea name="notes" placeholder="Temperament, allergies, etc."></textarea>
          </label>

          <label class="file-upload">
            Upload Photo
            <input type="file" name="photo" accept="image/*" />
          </label>

          <div class="form-actions">
            <button type="button" class="cancel-button" onclick="goBack()">Cancel</button>
            <button type="submit" class="submit-button">Add Pet</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");

      document.getElementById("addPetForm").addEventListener("submit", function (e) {
        e.preventDefault();
        alert("Pet added (placeholder)");
      });
    });

    function goBack() {
      document.body.classList.add("fade-out");
      setTimeout(() => window.location.href = "AllPets.html", 300);
    }
  </script>
</body>
</html>
