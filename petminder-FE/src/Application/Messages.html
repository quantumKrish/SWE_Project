<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages - PetMinder</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="Messages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&family=Inter:wght@800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.30.0/tabler-icons.min.css"
    />
  </head>

  <body>
    <div class="app-container fade-in">
      <div class="scrollable-content">
        <main class="homepage">
          <!-- Header -->
          <header>
            <h1 class="page-title">Messages</h1>
          </header>

          <!-- Search Input -->
          <section class="search-section">
            <div class="search-container">
              <div class="search-input-wrapper">
                <i class="ti ti-search search-icon" aria-hidden="true"></i>
                <input
                  type="text"
                  placeholder="Search messages"
                  class="search-input"
                  aria-label="Search messages"
                />
              </div>
            </div>
          </section>

          <!-- Message Threads -->
          <section class="message-list" aria-label="Message conversations">
            <article class="message-item">
              <div class="avatar-container">
                <div class="avatar">
                  <div class="avatar-image" style="background-image: url('');">
                    <span class="avatar-initial">A</span>
                  </div>
                </div>
              </div>
              <div class="message-content">
                <div class="message-header">
                  <h2 class="contact-name">Firstname Lastname</h2>
                  <span class="message-time">5 minutes</span>
                </div>
                <p class="message-preview">Example message here...</p>
              </div>
            </article>

            <article class="message-item">
              <div class="avatar-container">
                <div class="avatar">
                  <div class="avatar-image" style="background-image: url('');">
                    <span class="avatar-initial">A</span>
                  </div>
                </div>
              </div>
              <div class="message-content">
                <div class="message-header">
                  <h2 class="contact-name">Firstname Lastname</h2>
                  <span class="message-time">4 hours</span>
                </div>
                <p class="message-preview">Example message here...</p>
              </div>
            </article>

            <article class="message-item">
              <div class="avatar-container">
                <div class="avatar">
                  <div class="avatar-image" style="background-image: url('');">
                    <span class="avatar-initial">A</span>
                  </div>
                </div>
              </div>
              <div class="message-content">
                <div class="message-header">
                  <h2 class="contact-name">Firstname Lastname</h2>
                  <span class="message-time">3 weeks</span>
                </div>
                <p class="message-preview">Example message here...</p>
              </div>
            </article>
          </section>

          <!-- Bottom Padding -->
          <div class="nav-spacer"></div>
        </main>
      </div>

      <!-- Navigation Bar -->
      <nav class="bottom-navigation">
        <div class="nav-background"></div>
        <div class="nav-icons">
          <!-- Home -->
          <a href="Home.html" aria-label="Home">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/700457b31836db1d0b395fea39fb88c8c67be541"
              alt="Home"
              class="nav-icon"
            />
          </a>

          <!-- Messages (active) -->
          <a href="Messages.html" aria-label="Messages">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/90c0fa9386108cc4b6b2d22a3755f8429b1df731"
              alt="Messages"
              class="nav-icon active-icon"
            />
          </a>

          <!-- Search -->
          <a href="SearchMinder.html" class="search-button" aria-label="Search">🔍</a>

          <!-- Settings -->
          <a href="Settings.html" aria-label="Settings">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/2b7ab3e93b6956692a7a790f3b78eaeb88398c90"
              alt="Settings"
              class="nav-icon-large"
            />
          </a>

          <!-- Profile -->
          <a href="Profile.html" aria-label="User Profile">
            <img
              src="https://cdn.builder.io/api/v1/image/assets/TEMP/a5b95812132a4e335c2892d2eed0e35d70aa6271"
              alt="Profile"
              class="nav-icon"
            />
          </a>
        </div>
      </nav>
    </div>

    <!-- Page Transitions -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("fade-in");

        document.querySelectorAll(".message-item").forEach(item => {
          item.addEventListener("click", () => {
            item.classList.add("pulse");
            setTimeout(() => item.classList.remove("pulse"), 300);
          });
        });

        document.querySelectorAll("a").forEach(link => {
          link.addEventListener("click", e => {
            if (link.hostname === window.location.hostname) {
              e.preventDefault();
              const href = link.getAttribute("href");

              if (!link.classList.contains("search-button")) {
                const rect = link.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const ripple = document.createElement("span");
                ripple.classList.add("ripple");
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                link.appendChild(ripple);

                setTimeout(() => ripple.remove(), 600);
              }

              document.body.classList.add("fade-out");
              setTimeout(() => (window.location.href = href), 300);
            }
          });
        });
      });
    </script>
  </body>
</html>
