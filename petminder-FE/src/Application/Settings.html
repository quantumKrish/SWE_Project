<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Settings - PetMinder</title>

  <!-- Fonts & Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&family=Inter:wght@800&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="Settings.css" />
</head>

<body class="fade-in">
  <div class="app-container">
    <div class="scrollable-content">
      <main class="settings-page">

        <!-- Page Title -->
        <header>
          <h1 class="settings-title">Settings</h1>
        </header>

        <!-- Settings Menu -->
        <nav class="settings-menu">
          <ul class="menu-list">

            <li class="menu-item">
              <a href="Account.html" class="menu-link">
                <img src="https://cdn.builder.io/api/v1/image/assets/82d483615798456e8eba6eee5f39bef1/226350218efcd0602ac266688113e0c44d2c4899" class="menu-icon" alt="Account icon" />
                <span class="menu-text">Account</span>
              </a>
              <div class="menu-divider"></div>
            </li>

            <li class="menu-item">
              <a href="Payment.html" class="menu-link">
                <img src="https://cdn.builder.io/api/v1/image/assets/82d483615798456e8eba6eee5f39bef1/ba9eadb6afd0ff29c7822743da86820e6b167315" class="menu-icon" alt="Payment icon" />
                <span class="menu-text">Payment</span>
              </a>
              <div class="menu-divider"></div>
            </li>

            <li class="menu-item">
              <a href="Bookings.html" class="menu-link">
                <img src="https://cdn.builder.io/api/v1/image/assets/82d483615798456e8eba6eee5f39bef1/c0d95cfe01d8da7f827cca3d22a3f67d6f26498d" class="menu-icon" alt="Bookings History icon" />
                <span class="menu-text">Bookings History</span>
              </a>
              <div class="menu-divider"></div>
            </li>

            <li class="menu-item">
              <a href="Support.html" class="menu-link">
                <img src="https://cdn.builder.io/api/v1/image/assets/82d483615798456e8eba6eee5f39bef1/168fce47d711a136b9478f3b753dc8ac28919cde" class="menu-icon" alt="Support icon" />
                <span class="menu-text">Support</span>
              </a>
              <div class="menu-divider"></div>
            </li>

          </ul>
        </nav>

        <!-- Logout Button -->
        <button class="logout-button" aria-label="Logout">Logout</button>

        <!-- Spacer for Bottom Nav -->
        <div class="nav-spacer"></div>
      </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-navigation">
      <div class="nav-background"></div>
      <div class="nav-icons">
        <a href="Home.html" aria-label="Home">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/700457b31836db1d0b395fea39fb88c8c67be541" class="nav-icon" alt="Home" />
        </a>
        <a href="Messages.html" aria-label="Messages">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/90c0fa9386108cc4b6b2d22a3755f8429b1df731" class="nav-icon" alt="Messages" />
        </a>
        <a href="SearchMinder.html" class="search-button" aria-label="Search">🔍</a>
        <a href="Settings.html" aria-label="Settings">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/2b7ab3e93b6956692a7a790f3b78eaeb88398c90" class="nav-icon-large active-icon" alt="Settings" />
        </a>
        <a href="Profile.html" aria-label="User Profile">
          <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/a5b95812132a4e335c2892d2eed0e35d70aa6271" class="nav-icon" alt="Profile" />
        </a>
      </div>
    </nav>
  </div>

  <!-- JS for ripple + transition -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.body.classList.add("fade-in");

      document.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", e => {
          if (link.hostname === window.location.hostname) {
            e.preventDefault();

            const href = link.getAttribute("href");
            const rect = link.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const ripple = document.createElement("span");
            ripple.classList.add("ripple");
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            link.appendChild(ripple);

            setTimeout(() => ripple.remove(), 600);
            document.body.classList.add("fade-out");
            setTimeout(() => window.location.href = href, 300);
          }
        });
      });
    });
  </script>
</body>
</html>
