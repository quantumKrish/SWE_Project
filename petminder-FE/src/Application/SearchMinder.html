<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find a Minder - PetMinder</title>
    <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300;400;700&family=Inter:wght@800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="SearchMinder.css" />
  </head>
  <body class="fade-in">
    <div class="app-container">
      <div class="scrollable-content">
        <main class="homepage">
          <header>
            <h1 class="page-title">Find a minder</h1>
            <div class="toggle-tabs">
              <div class="toggle-slider" id="toggleSlider"></div>
              <button class="toggle-tab active" onclick="toggleTabs(this)">All</button>
              <button class="toggle-tab" onclick="toggleTabs(this)">Available</button>
            </div>
          </header>

          <section class="search-section">
            <div class="search-input-wrapper">
              <span class="search-icon"></span>
              <input type="text" class="search-input" placeholder="Search minders or Enter a location" aria-label="Search minders" />
            </div>
          </section>

          <section class="filter-options">
            <button class="filter-button" onclick="openModal('filterModal')">Filter</button>
            <button class="date-button" onclick="openModal('dateModal')">Date</button>
            <button class="sort-button" onclick="openModal('sortModal')">Sort by</button>
          </section>

          <section class="minders-list" aria-label="Minders">
            <article class="minder-card">
              <div class="avatar">
                <div class="avatar-image"><span class="avatar-initial">A</span></div>
              </div>
              <div class="minder-details">
                <div class="minder-header">
                  <h2 class="minder-name">Firstname Lastname</h2>
                  <div class="rating">
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                    <span class="star">★</span>
                  </div>
                </div>
                <div class="minder-actions">
                  <button class="book-button" onclick="window.location.href='BookingMinder.html'">Book</button>
                  <button class="message-button">Message</button>
                </div>
                <p class="minder-bio">Bio</p>
              </div>
            </article>
          </section>

          <div class="nav-spacer"></div>
        </main>
      </div>

      <!-- Filter Modal -->
      <div id="filterModal" class="modal-overlay">
        <div class="modal-content">
          <h3>Filter Options</h3>
          <label for="rating-filter">By Rating</label>
          <select id="rating-filter">
            <option>5 stars</option>
            <option>4 stars</option>
            <option>3 stars</option>
            <option>2 stars</option>
            <option>1 star</option>
          </select>
          <label for="radius-filter">By Distance</label>
          <select id="radius-filter">
            <option>1 km</option>
            <option>2 km</option>
            <option>3 km</option>
            <option>4 km</option>
            <option>5 km</option>
          </select>
          <div class="modal-actions">
            <button onclick="closeModal('filterModal')">Close</button>
            <button class="apply">Apply</button>
          </div>
        </div>
      </div>

      <!-- Sort Modal -->
      <div id="sortModal" class="modal-overlay">
        <div class="modal-content">
          <h3>Sort Options</h3>
          <select>
            <option>Sort by name ascending</option>
            <option>Sort by name descending</option>
            <option>Sort by distance</option>
            <option>Sort by rating</option>
          </select>
          <div class="modal-actions">
            <button onclick="closeModal('sortModal')">Close</button>
            <button class="apply">Apply</button>
          </div>
        </div>
      </div>

      
      <!-- Date Modal -->
      <div id="dateModal" class="modal-overlay">
        <div class="modal-content">
          <h3>Select a Date</h3>
          <input type="date" id="available-date" />
          <div class="modal-actions">
            <button onclick="closeModal('dateModal')">Cancel</button>
            <button class="apply" onclick="applyDate()">Apply</button>
          </div>
        </div>
      </div>


      <!-- Bottom Navigation -->
      <nav class="bottom-navigation">
        <div class="nav-background"></div>
        <div class="nav-icons">
          <a href="Home.html" aria-label="Home">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/700457b31836db1d0b395fea39fb88c8c67be541" class="nav-icon" alt="Home" />
          </a>
          <a href="Messages.html" aria-label="Messages">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/90c0fa9386108cc4b6b2d22a3755f8429b1df731" class="nav-icon" alt="Messages" />
          </a>
          <a href="SearchMinder.html" class="search-button" aria-label="Search">🔍</a>
          <a href="Settings.html" aria-label="Settings">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/2b7ab3e93b6956692a7a790f3b78eaeb88398c90" class="nav-icon-large" alt="Settings" />
          </a>
          <a href="Profile.html" aria-label="User Profile">
            <img src="https://cdn.builder.io/api/v1/image/assets/TEMP/a5b95812132a4e335c2892d2eed0e35d70aa6271" class="nav-icon" alt="Profile" />
          </a>
        </div>
      </nav>
    </div>

    <!-- JS Logic -->
    <script>
      function openModal(id) {
        document.getElementById(id).style.display = "flex";
      }

      function closeModal(id) {
        document.getElementById(id).style.display = "none";
      }

      function toggleTabs(selected) {
        const tabs = document.querySelectorAll(".toggle-tab");
        tabs.forEach(tab => tab.classList.remove("active"));
        selected.classList.add("active");

        const slider = document.getElementById("toggleSlider");
        slider.style.left = selected.offsetLeft + "px";
        slider.style.width = selected.offsetWidth + "px";
      }

      function applyDate() {
        const date = document.getElementById("available-date").value;
        if (date) {
          console.log("Selected date:", date);
        }
        closeModal("dateModal");
      }

      document.addEventListener("DOMContentLoaded", () => {
        const activeTab = document.querySelector(".toggle-tab.active");
        const slider = document.getElementById("toggleSlider");
        slider.style.left = activeTab.offsetLeft + "px";
        slider.style.width = activeTab.offsetWidth + "px";
        document.body.classList.add("fade-in");
      });
    </script>
  </body>
</html>
